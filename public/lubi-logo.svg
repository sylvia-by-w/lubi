<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Lubi logo"
>
  <!-- 左侧时间块 -->
  <rect x="8" y="7" width="10" height="10" rx="2" fill="#111111" />
  <rect x="8" y="20" width="10" height="10" rx="2" fill="#111111" />
  <rect x="8" y="33" width="10" height="10" rx="2" fill="#111111" />
  <rect x="8" y="46" width="10" height="10" rx="2" fill="#111111" />

  <!-- 底部时间块，组成 L -->
  <rect x="21" y="46" width="10" height="10" rx="2" fill="#111111" />
  <rect x="34" y="46" width="10" height="10" rx="2" fill="#111111" />

  <!-- 时间刻度 -->
  <rect
    x="29"
    y="10"
    width="3"
    height="7"
    rx="1.5"
    fill="#111111"
    transform="rotate(-8 30.5 13.5)"
  />
  <rect
    x="39"
    y="14"
    width="3"
    height="7"
    rx="1.5"
    fill="#111111"
    transform="rotate(28 40.5 17.5)"
  />
  <rect
    x="47"
    y="22"
    width="3"
    height="7"
    rx="1.5"
    fill="#111111"
    transform="rotate(55 48.5 25.5)"
  />
  <rect
    x="51"
    y="33"
    width="3"
    height="7"
    rx="1.5"
    fill="#111111"
    transform="rotate(82 52.5 36.5)"
  />
</svg>